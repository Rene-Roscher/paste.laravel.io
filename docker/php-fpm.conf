[www]
user = www-data
group = www-data
; Listens on 9000 (set by the official image), nginx connects to 127.0.0.1:9000.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
; Let APP_KEY, DB_* etc. passed as container environment variables reach Laravel.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
